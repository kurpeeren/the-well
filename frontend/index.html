<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/kuyu-icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <title>KUYU</title>
    <meta name="description" content="KUYU — Karanlık Bir Köyün Olayları. Köy mührünü çöz, gerçeği bul." />
    <!-- Open Graph / WhatsApp/Telegram/Discord paylaşımı için kare olmayan, radius'suz görsel -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="KUYU — Fısıltılar Köyü" />
    <meta property="og:description" content="Karanlık bir köyün olayları. Köy mührünü çöz, gerçeği bul." />
    <meta property="og:image" content="/kuyu-share.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KUYU — Fısıltılar Köyü" />
    <meta name="twitter:description" content="Karanlık bir köyün olayları." />
    <meta name="twitter:image" content="/kuyu-share.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for(let registration of registrations) {
              registration.unregister();
            }
          });
        });
      }
    </script>
  </body>
</html>
